workspace:
  inheritedTasks:
    include:
      - scad.docs
      - scad.verify

tasks:
  scad.docs:
    inputs:
      - 'openscad/**/*.scad'
      - 'openscad/**/design/**'
      - 'pythonscad/**/*.py'
      - 'pythonscad/**/design/**'
      - 'scripts/render-openscad-design.sh'

  scad.verify:
    inputs:
      - 'openscad/tube-clamp/tube_clamp.scad'
      - 'pythonscad/tube-clamp/tube_clamp.py'
      - 'test/**'
      - 'vrf/README.md'
      - 'scripts/run-verification.sh'
      - 'scripts/build-verification-index.sh'
      - 'bootstrap.sh'
      - 'bootstrap.ps1'
      - 'update-repo.sh'
      - 'update-repo.ps1'
      - '.github/workflows/**'
      - 'tools/tool.git-project'
