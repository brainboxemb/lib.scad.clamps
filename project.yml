project:
  name: lib.scad.clamps

tooling:
  tool_scad_project:
    type: git-submodule
    url: https://github.com/brainboxemb/tool.scad-project.git
    path: tools/tool.scad-project
    ref: v0.6.0

paths:
  design_root: .
  build_root: bld

openscad:
  common_flags:
    - --enable=object-function
  render_flags:
    - --render
  image_size: [1600, 1000]
  design_image_size: [640, 480]

pythonscad:
  common_flags:
    - --trust-python
  render_flags:
    - --render

verification:
  commands:
    - [bash, scripts/run-verification.sh]
    - [bash, scripts/build-verification-index.sh]
  output_root: vrf/out

publication:
  production:
    source_branch: main
    build_branch: build
    verification_branch: verification

  development:
    build_branch: dev/build
    verification_branch: dev/verification

  tags:
    pattern: "v*"
