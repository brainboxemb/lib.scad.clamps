name: Prepare clamps v0.1.5 release

on:
  push:
    branches:
      - feature/release-v0.1.5

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release-prep branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/release-v0.1.5
          fetch-depth: 1

      - name: Prepare v0.1.5 changelog and README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '## v0.1.4\n'
          section = '''## v0.1.5

### Changed

- Align the final Migration-005 consumer baseline to released `tool.scad-project v0.14.8` with exact tool gitlink `85781a6b21a0f6a06d37be154fd9eb475ecaa2a4`.
- Use semantic `v0.14.8` Production and thin split Release callers while retaining the existing full/dual runtime and `build_engine.engine: direct` policy with no SCons cache transport.
- Requalify the affected PR (`35101169850`), merged main (`35101626924`) and README-only zero-runtime (`35101816174`) paths without changing clamp API, geometry or functional verification behaviour.

'''
          if '## v0.1.5\n' not in text:
              if heading not in text:
                  raise SystemExit('v0.1.4 changelog heading not found')
              text = text.replace(heading, section + heading, 1)
          changelog.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          replacements = {
              'Normal pull-request and `main` production uses the released Migration-005 lifecycle from `tool.scad-project v0.14.3`.':
              'Normal pull-request and `main` production uses the final released Migration-005 lifecycle from `tool.scad-project v0.14.8`.',
              '`tool.scad-project` is declared in `project.yml`, locked by its gitlink and matched by the exact reusable Production/Release workflow commit pins.':
              '`tool.scad-project` is declared in `project.yml`, locked by its exact gitlink, while Production/Release callers use the matching immutable semantic release ref `v0.14.8`.',
              'the SCAD wrapper additionally aligns SCAD reusable-workflow refs to the exact SCAD-tool gitlink.':
              'the SCAD wrapper additionally aligns SCAD reusable-workflow refs with the released SCAD-tool dependency policy.'
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'README marker not found: {old}')
              text = text.replace(old, new)
          readme.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit release preparation when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md README.md; then
            echo 'Release preparation already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md
          git diff --cached --check
          git commit -m 'Prepare clamps v0.1.5 release'
          git push origin HEAD:feature/release-v0.1.5
