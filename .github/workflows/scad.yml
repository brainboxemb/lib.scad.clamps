name: SCAD production

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  scad:
    if: github.head_ref != 'diagnostic/migration-005-moon-hash-stability'
    uses: brainboxemb/tool.scad-project/.github/workflows/project-production.yml@28661fc040c4994e9c1d391285b7425c7a55252b
    with:
      affected_task: consumer:scad.production-impact
      aggregate_task: consumer:scad.ci
      cache_namespace: lib-scad-clamps-production-v1
      build_artifact_name: lib-scad-clamps-build-publication
      verification_artifact_name: lib-scad-clamps-verification-publication
