name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release version, e.g. v0.1.0"
        required: true
        type: string
      source_sha:
        description: "Exact 40-character source commit SHA from main"
        required: true
        type: string
  push:
    branches:
      - "release-request/**"

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  release-dispatch:
    if: github.event_name == 'workflow_dispatch'
    uses: brainboxemb/tool.scad-project/.github/workflows/project-release.yml@v0.15.7
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
      build_path: bld
      verification_path: vrf/out

  release-request:
    if: github.event_name == 'push'
    uses: brainboxemb/tool.scad-project/.github/workflows/project-release.yml@v0.15.7
    with:
      build_path: bld
      verification_path: vrf/out
