name: SCons stable-cache diagnostic

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    name: diagnose SCons object cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCAD_TOOLCHAIN_IMAGE: ghcr.io/brainboxemb/scad-toolchain:v0.4.1

    steps:
      - name: Checkout exact PR head with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          fetch-depth: 1
          persist-credentials: false

      - name: Restore previous diagnostic SCons cache
        uses: actions/cache@v4
        with:
          path: .cache/scad-project/scons
          key: migration-005-scons-stable-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            migration-005-scons-stable-${{ runner.os }}-${{ github.run_id }}-

      - name: Inspect restored SCons cache
        shell: bash
        run: |
          set -euo pipefail
          echo '--- restored SCons cache ---'
          if [[ -d .cache/scad-project/scons ]]; then
            find .cache/scad-project/scons -type f -print | sort
            du -sh .cache/scad-project/scons || true
          else
            echo 'cache directory absent'
          fi

      - name: Pull SCAD runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          docker pull "$SCAD_TOOLCHAIN_IMAGE"
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Run design documentation directly through SCons-backed tooling
        shell: bash
        run: |
          set -euo pipefail
          start_ns="$(date +%s%N)"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CI=true \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e "SCAD_TOOLCHAIN_IMAGE=$SCAD_TOOLCHAIN_IMAGE" \
            -e SCAD_TOOLCHAIN_VERSION=v0.4.1 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$SCAD_TOOLCHAIN_IMAGE" bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              bash ./bootstrap.sh
              git config --global --add safe.directory /work/tools/tool.git-project
              git config --global --add safe.directory /work/tools/tool.scad-project
              bash ./tools/tool.scad-project/scad-project.sh tooling-check
              bash ./tools/tool.scad-project/scad-project.sh design-build
            '

          end_ns="$(date +%s%N)"
          python3 - "$start_ns" "$end_ns" <<'PY'
          import sys
          start, end = map(int, sys.argv[1:])
          print(f'design-build elapsed seconds: {(end-start)/1_000_000_000:.3f}')
          PY

      - name: Inspect SCons state and cache after build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '--- SCons cache after build ---'
          if [[ -d .cache/scad-project/scons ]]; then
            find .cache/scad-project/scons -type f -print | sort
            echo "file-count=$(find .cache/scad-project/scons -type f | wc -l)"
            du -sh .cache/scad-project/scons || true
          else
            echo 'cache directory absent'
          fi
          echo '--- SCons decision report ---'
          cat .cache/scad-project/state/last-design-build.json || true
          echo '--- SCons executed targets ---'
          cat .cache/scad-project/state/executed-design-targets.txt || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scons-stable-cache-attempt-${{ github.run_attempt }}
          path: |
            .cache/scad-project/state
          if-no-files-found: warn
          retention-days: 7
