name: Verify SCAD project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "openscad/**"
      - "pythonscad/**"
      - "test/**"
      - "scripts/run-verification.sh"
      - "scripts/build-verification-index.sh"
      - "project.yml"
      - ".gitmodules"
      - "tools/tool.scad-project"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "openscad/**"
      - "pythonscad/**"
      - "test/**"
      - "scripts/run-verification.sh"
      - "scripts/build-verification-index.sh"
      - "project.yml"
      - ".gitmodules"
      - "tools/tool.scad-project"
      - ".github/workflows/verify.yml"

permissions:
  contents: write
  packages: read

jobs:
  verify:
    uses: brainboxemb/tool.scad-project/.github/workflows/project-verify.yml@v0.4.3
    with:
      artifact_name: lib-scad-clamps-verification
      verification_path: vrf/out
