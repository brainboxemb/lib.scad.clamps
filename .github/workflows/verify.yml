name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  verify:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: brainboxemb/tool.scad-project/.github/workflows/project-verify.yml@68301267273ea21c4b82ff3b26e1c8a30ff7b065
    with:
      artifact_name: lib-scad-clamps-verification
      verification_path: vrf/out
