name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  verify:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: brainboxemb/tool.scad-project/.github/workflows/project-verify.yml@ba93e9165f8c23df3f867c2ae7fa160187166d9d
    with:
      artifact_name: lib-scad-clamps-verification
      verification_path: vrf/out
