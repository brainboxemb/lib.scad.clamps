name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  verify:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: brainboxemb/tool.scad-project/.github/workflows/project-verify.yml@40694891d3239401cb0ba4bfb35a3812d6584ab7
    with:
      artifact_name: lib-scad-clamps-verification
      verification_path: vrf/out
