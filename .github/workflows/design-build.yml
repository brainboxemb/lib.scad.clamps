name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
      - "!release-request/**"
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: brainboxemb/tool.scad-project/.github/workflows/project-build.yml@827ae5fef4bffd83b81fb4e2eb580267d1dd3abb
    with:
      artifact_name: lib-scad-clamps-build
