name: Build SCAD project

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "openscad/**"
      - "pythonscad/**"
      - "project.yml"
      - ".gitmodules"
      - "tools/tool.scad-project"
      - ".github/workflows/design-build.yml"
  pull_request:
    paths:
      - "openscad/**"
      - "pythonscad/**"
      - "project.yml"
      - ".gitmodules"
      - "tools/tool.scad-project"
      - ".github/workflows/design-build.yml"

permissions:
  contents: write
  packages: read

jobs:
  build:
    uses: brainboxemb/tool.scad-project/.github/workflows/project-build.yml@v0.6.1
    with:
      artifact_name: lib-scad-clamps-build
