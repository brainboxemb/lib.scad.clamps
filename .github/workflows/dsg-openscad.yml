name: DSG - OpenSCAD design images

on:
  workflow_dispatch:
  push:
    paths:
      - "openscad/**"
      - "scripts/render-openscad-design.sh"
      - ".github/workflows/dsg-openscad.yml"

jobs:
  render-design-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Render OpenSCAD design images
        run: xvfb-run -a bash ./scripts/render-openscad-design.sh

      - name: Upload generated design images
        uses: actions/upload-artifact@v4
        with:
          name: dsg-openscad-tube-clamp
          path: openscad/tube-clamp/design/img/*.png
